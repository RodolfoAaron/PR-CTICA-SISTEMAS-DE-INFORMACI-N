<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feed</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Botón flotante para subir -->
  <button id="uploadBtn" class="upload-btn" aria-label="Subir foto">+</button>

  <!-- Modal de subida -->
  <div id="uploadModal" class="modal hidden">
    <div class="modal-content">
      <h2>Subir foto</h2>
      <form id="uploadForm">
        <div class="camera-area">
          <video id="camera" autoplay playsinline muted class="hidden"></video>
          <img id="preview" class="hidden" alt="" />
          <canvas id="snapshot"></canvas>

          <div class="camera-buttons">
            <button type="button" id="openCameraBtn" class="btn btn-secondary">Abrir cámara</button>
            <button type="button" id="shootBtn" class="btn btn-primary hidden">Disparar</button>
            <button type="button" id="retakeBtn" class="btn btn-secondary hidden">Repetir</button>
          </div>

          <label for="fileInput" class="file-label">… o elegir archivo</label>
          <input type="file" id="fileInput" accept="image/*" />
        </div>

        <label for="captionInput">Descripción (opcional)</label>
        <input type="text" id="captionInput" placeholder="Escribe algo..." maxlength="200" />

        <div class="modal-actions">
          <button type="button" id="cancelBtn" class="btn btn-secondary">Cancelar</button>
          <button type="submit" id="submitBtn" class="btn btn-primary">Subir</button>
        </div>

        <p id="uploadStatus" class="status"></p>
      </form>
    </div>
  </div>

  <!-- Feed -->
  <div id="feed" class="feed">
    <div class="message">Cargando...</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
